# ============================================================
# Microsoft Bing Rewards 自动化工具集 - 文档网站配置
# 部署: GitHub Pages + GitHub Actions (免费)
#
# ⚠️ 部署前必改: site_url 替换为你的实际地址
#   https://<GitHub用户名>.github.io/microsoft-bing-rewards-daily-task-script/
# ============================================================
site_name: Bing Rewards 自动化工具集
site_description: 自动化完成微软必应每日搜索任务，智能积累奖励积分
site_url: https://idbb98.github.io/microsoft-bing-rewards-daily-task-script/
repo_url: https://gitee.com/idbb98/microsoft-bing-rewards-daily-task-script
repo_name: 项目主页

# ---------- 主题 ----------
theme:
  name: material
  language: zh
  icon:
    logo: material/microsoft-bing
    repo: fontawesome/brands/git-alt
  favicon: assets/favicon.ico
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# ---------- 插件 ----------
plugins:
  - search:
      lang:
        - zh
        - en
  - social

# ---------- Markdown 扩展 ----------
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ---------- 导航结构 ----------
nav:
  - 首页: index.md
  - 浏览器脚本版指南: scripts/userscript.md
  - 版本历史: changelog.md
  - 其他版本: other-versions.md
  - 常见问题: faq.md

# ---------- 页脚 ----------
extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://gitee.com/idbb98/microsoft-bing-rewards-daily-task-script
      name: 项目主页
copyright: Copyright &copy; 2026 Brian. 基于 MIT 许可证开源，仅供学习与交流自动化技术之用。
